# Docker DNS로 Backend 컨테이너 교체 후 변경된 내부 IP도 조회합니다.
# 쿼리 문자열에는 비밀번호 재설정 토큰이 포함될 수 있으므로 접속 로그에서 제외합니다.
log_format outpick_safe '$time_iso8601 "$request_method $uri $server_protocol" $status $body_bytes_sent';

upstream backend_app {
    zone backend_app 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:8080 resolve;
}

server {
    listen 80 default_server;
    server_name outpick.chocobe.shop;
    access_log /var/log/nginx/access.log outpick_safe;

    # 자동 갱신 시에도 이 경로는 HTTPS로 이동시키지 않습니다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        # 요청의 Host 대신 정해진 서비스 도메인으로 이동합니다.
        return 308 https://outpick.chocobe.shop$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name outpick.chocobe.shop;
    access_log /var/log/nginx/access.log outpick_safe;

    ssl_certificate /etc/letsencrypt/live/outpick.chocobe.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/outpick.chocobe.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    location /api/ {
        # 뒤에 /를 붙이지 않아 /api/v1/... 경로를 그대로 전달합니다.
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 클라이언트가 보낸 X-Forwarded-For를 신뢰하지 않고 실제 접속 주소로 덮어씁니다.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }
}
