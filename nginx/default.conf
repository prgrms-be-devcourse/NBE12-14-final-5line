# Docker DNS로 Backend 컨테이너 교체 후 변경된 내부 IP도 조회합니다.
# 쿼리 문자열에는 비밀번호 재설정 토큰이 포함될 수 있으므로 접속 로그에서 제외합니다.
log_format outpick_safe '$time_iso8601 "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log outpick_safe;

upstream backend_app {
    zone backend_app 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:8080 resolve;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    # Certbot이 작성한 도메인 소유 확인 파일을 HTTP 80번으로 제공합니다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location /api/ {
        # 뒤에 /를 붙이지 않아 /api/v1/... 경로를 그대로 전달합니다.
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Next.js가 내보낸 경로별 index.html과 JS·CSS·탐색용 txt 파일을 제공합니다.
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }
}
