spring:
  application:
    name: backend
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"

app:
  login-limit:
    max-failures: 5
    window-minutes: 15
