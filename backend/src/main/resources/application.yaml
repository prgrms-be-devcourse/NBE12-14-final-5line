spring:
  application:
    name: backend
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"

app:
  auth:
    jwt-secret: ${AUTH_JWT_SECRET_BASE64:}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  login-limit:
    max-failures: 5
    window-minutes: 15
