# 인증서를 발급하거나 복원한 후 compose.deploy.yaml 뒤에 함께 지정합니다.
services:
  backend:
    environment:
      SERVER_FORWARDHEADERSSTRATEGY: native
  nginx:
    ports:
      - "443:443"
    volumes:
      - type: bind
        source: ./nginx/https.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
